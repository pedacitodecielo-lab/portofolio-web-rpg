<!-- BOOT / TITLE SCREEN -->
<div id="boot" class="boot">
  <div class="boot-content">
    <div class="boot-logo">
      <div class="boot-pixel"></div>
    </div>
    <h1 class="boot-title">The <em>Data</em> Tavern</h1>
    <div class="boot-subtitle">A portfolio by Emelio Exaudi Lumban Gaol</div>
    <button class="boot-btn" id="boot-start">▶ Press to Enter</button>
    <div class="boot-controls">
      <div class="bc-row"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>Move</span></div>
      <div class="bc-row"><span><kbd>E</kbd> / <kbd>SPACE</kbd></span><span>Interact</span></div>
      <div class="bc-row"><span><kbd>I</kbd></span><span>Inventory</span></div>
      <div class="bc-row"><span><kbd>ESC</kbd></span><span>Close panels</span></div>
    </div>
  </div>
</div>

<!-- GAME -->
<div class="game" id="game">

  <!-- The tile-based world rendered as DOM elements -->
  <div class="viewport" id="viewport">
    <div class="world" id="world">
      <!-- Generated by JS: tiles, furniture, NPCs, player -->
    </div>
  </div>

  <!-- HUD: top bar -->
  <div class="hud-top">
    <div class="hud-loc">
      <span class="hud-icon">◆</span>
      <span id="loc-name">The Data Tavern</span>
    </div>
    <div class="hud-meta">
      <span><kbd>I</kbd> Inventory</span>
      <span><kbd>E</kbd> Interact</span>
    </div>
  </div>

  <!-- Interaction prompt -->
  <div class="prompt" id="prompt">
    <kbd>E</kbd> <span id="prompt-text">Interact</span>
  </div>

  <!-- Dialog box -->
  <div class="dialog" id="dialog">
    <div class="dialog-portrait" id="dialog-portrait"></div>
    <div class="dialog-content">
      <div class="dialog-name" id="dialog-name">—</div>
      <div class="dialog-text" id="dialog-text"></div>
      <div class="dialog-choices" id="dialog-choices"></div>
      <div class="dialog-continue" id="dialog-continue">▼ Press <kbd>E</kbd> or <kbd>SPACE</kbd></div>
    </div>
  </div>

  <!-- Inventory panel -->
  <div class="inventory" id="inventory">
    <div class="inv-header">
      <span class="inv-title">// INVENTORY</span>
      <button class="inv-close" id="inv-close">×</button>
    </div>
    <div class="inv-tabs" id="inv-tabs"></div>
    <div class="inv-body" id="inv-body"></div>
    <div class="inv-footer">
      <span><kbd>Tab</kbd> Switch · <kbd>↑↓</kbd> Navigate · <kbd>E</kbd> Open · <kbd>I</kbd> Close</span>
    </div>
  </div>

  <!-- Item detail modal (showcase) -->
  <div class="item-modal" id="item-modal">
    <div class="item-modal-inner">
      <button class="item-close" id="item-close">× CLOSE</button>
      <div class="item-content" id="item-content"></div>
    </div>
  </div>

</div>

<!-- Mobile fallback -->
<div class="mobile-fallback" id="mobile">
  <!-- populated by JS -->
</div>
